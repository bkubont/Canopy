# Local development only. Hosted settings must be reviewed separately.
project_id = "Canopy"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8765/dist/cloud.html"
additional_redirect_urls = ["http://127.0.0.1:8765/dist/cloud.html"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Keep the email/password provider enabled; the global flag disables public signup.
enable_signup = true
enable_confirmations = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
