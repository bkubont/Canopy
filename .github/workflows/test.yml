name: Canopy foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Run core and configuration tests
        run: npm test
      - name: Test real PostgreSQL authorization policies
        run: npm run test:db
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify V1 desktop and mobile workflows
        run: npx playwright test tests/browser/v1.spec.cjs
